<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="피부장벽, 화장품, 모공개선, 닥터자르트, 닥터, Dr, DR, 시카수딩크림, 시카크림">
    <meta name="description" content="의학과 예술이 함께하는 닥터자르트의 시카수딩크림부터 피부고민 맞춤 제품들을 지금 바로 만나보세요">
    <title>Dr.Jart+</title>
    <!-- 글꼴 -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" />
    <!-- 초기화 및 디자인 -->
    <link rel="stylesheet" href="./styles/reset.css">
    <link rel="stylesheet" href="./styles/var.css">
    <link rel="stylesheet" href="./styles/index.css">
    <!-- 자바스크립트 연결 -->
    <script src="./scripts/index.js" defer></script>
</head>
<body>
    <header> <!-- 고정헤더영역 -->
        <div class="top_ad flex-r-e-c"> <!-- 헤더 위 띠배너 광고 -->

            <button type="button" id="total_menu"><img src="./images/total_menu.svg" alt="전체메뉴열기"></button>
            <a href="./index.html" class="logo"><img src="./images/menu_logo.svg" alt="닥터자르트 메인홈"></a>
            <span class="main_menu">
                <button type="button" id="login">LOGIN</button>
                <a href="#" class="secrch">SEARCH</a>
                <a href="#" class="cart">CART<img src="./images/cart_count.svg" alt=""></a>
                <a href="#" class="account">ACCOUNT</a>
            </span>
        </div>
        <!-- total_menu 클릭 시 실행되는 메뉴창 -->
        <div class="menu_popup"></div>
    </header> <!-- 헤더영역종료 -->

</html>
